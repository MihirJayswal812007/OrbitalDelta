model:
  encoder: resnet18
  pretrained: true
  in_channels: 3
  decoder: unet

training:
  batch_size: 8
  epochs: 200
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  scheduler: cosine_annealing_warm_restarts
  scheduler_T0: 10
  early_stopping_patience: 15
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
  mixed_precision: true
  gradient_clip_norm: 1.0

data:
  dataset: levir-cd
  root: ./data/processed/levir-cd
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  crop_size: 256
  num_workers: 4

logging:
  backend: tensorboard  # or wandb
  log_dir: ./logs
  log_every_n_steps: 50
  save_top_k: 3

seed: 42
