data:
  crop_size: 256
  dataset: levir-cd
  num_workers: 2
  root: ./data/processed/levir-cd
  test_split: 0.15
  train_split: 0.7
  val_split: 0.15
logging:
  backend: tensorboard
  log_dir: ./logs
  log_every_n_steps: 50
  save_top_k: 3
model:
  decoder: unet
  encoder: resnet18
  in_channels: 3
  pretrained: true
seed: 42
training:
  batch_size: 8
  early_stopping_patience: 15
  epochs: 200
  gradient_clip_norm: 1.0
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
  lr: 0.001
  mixed_precision: true
  optimizer: adamw
  scheduler: cosine_annealing_warm_restarts
  scheduler_T0: 10
  weight_decay: 0.0001
