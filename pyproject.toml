[project]
name = "orbitaldelta"
version = "0.1.0"
description = "Satellite Image Change Detection System"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN001"]
ignore = ["ANN001", "E501"]
exclude = ["notebooks/", ".venv/", "build/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
exclude = '''/(notebooks|\.venv|build)/'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*", "notebooks/*"]
